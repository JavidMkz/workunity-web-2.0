<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>WorkUnity Agent Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b2545'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='18' font-weight='700' fill='%2314b8a6' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex,nofollow">
<style>
/* ============================================================
   1 — TOKENS
   ============================================================ */
:root{
  --navy:#0b2545;
  --navy-2:#123568;
  --navy-ink:#ffffff;
  --teal:#14b8a6;
  --teal-dark:#0d9488;
  --teal-ink:#ffffff;

  --bg:#f2f5f9;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --border:#e2e8f0;
  --text:#0f172a;
  --muted:#64748b;
  --muted-2:#94a3b8;

  --green:#16a34a;   --green-bg:#dcfce7;   --green-line:#86efac;
  --yellow:#a16207;  --yellow-bg:#fef9c3;  --yellow-line:#fde047;
  --red:#dc2626;     --red-bg:#fee2e2;     --red-line:#fca5a5;
  --blue:#2563eb;    --blue-bg:#dbeafe;    --blue-line:#93c5fd;
  --gray:#475569;    --gray-bg:#f1f5f9;    --gray-line:#cbd5e1;

  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 1px 6px rgba(15,23,42,.05);
  --shadow-lg:0 12px 32px rgba(15,23,42,.18);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --navy:#0e1b32;
  --navy-2:#16294a;
  --bg:#0a0f1a;
  --surface:#111a2e;
  --surface-2:#0d1524;
  --border:#233150;
  --text:#e7ecf5;
  --muted:#98a6c2;
  --muted-2:#6c7b9c;

  --green:#4ade80;   --green-bg:#0f2e1c;   --green-line:#1f5c37;
  --yellow:#fbbf24;  --yellow-bg:#332a08;  --yellow-line:#5c4a10;
  --red:#f87171;     --red-bg:#3a1414;     --red-line:#6b2323;
  --blue:#60a5fa;    --blue-bg:#0f2547;    --blue-line:#1f3f6e;
  --gray:#b9c4dd;    --gray-bg:#1b2740;    --gray-line:#324268;

  --shadow:0 1px 2px rgba(0,0,0,.35), 0 1px 8px rgba(0,0,0,.3);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
}

/* ============================================================
   2 — BASE / RESET
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a:not(.btn){color:var(--teal-dark)}
[data-theme="dark"] a:not(.btn){color:var(--teal)}
h1,h2,h3,h4{margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 8px}
.hidden{display:none!important}
::selection{background:var(--teal);color:#fff}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* scrollbar niceties */
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--muted-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   3 — LAYOUT SHELL
   ============================================================ */
.shell{display:flex;flex-direction:column;min-height:100vh}
.topbar{
  display:flex;align-items:center;gap:12px;height:60px;flex:none;
  padding-inline:16px;background:var(--navy);color:var(--navy-ink);
  position:sticky;top:0;z-index:200;box-shadow:var(--shadow);
}
.topbar__logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff;
  background:none;border:none;cursor:pointer;padding:6px 4px;border-radius:var(--radius-sm)}
.topbar__logo:hover{background:rgba(255,255,255,.08)}
.topbar__badge{width:30px;height:30px;border-radius:9px;background:var(--teal);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.topbar__name{font-weight:800;font-size:16px;white-space:nowrap}
.topbar__spacer{flex:1}
.topbar__tools{display:flex;align-items:center;gap:6px;flex:none}
.icon-btn{
  width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);color:#fff;cursor:pointer;display:grid;place-items:center;
  position:relative;transition:.15s;flex:none;
}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn svg{width:18px;height:18px}
.badge-dot{
  position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;
  background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;
  border:2px solid var(--navy);
}
.topbar__user{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border-radius:99px;
  background:rgba(255,255,255,.08);flex:none}
.avatar{width:28px;height:28px;border-radius:99px;background:var(--teal);color:#fff;font-weight:800;
  font-size:12px;display:grid;place-items:center;flex:none}
.topbar__user-meta{display:flex;flex-direction:column;line-height:1.2}
.topbar__user-name{font-size:12.5px;font-weight:700}
.topbar__user-role{font-size:10.5px;color:rgba(255,255,255,.65)}

.bell-panel{
  position:fixed;top:66px;right:14px;width:340px;max-width:calc(100vw - 20px);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);z-index:300;overflow:hidden;
}
.bell-panel__head{display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text)}
.bell-panel__body{max-height:360px;overflow-y:auto}
.bell-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
.bell-item:last-child{border-bottom:none}
.bell-item--unread{background:rgba(20,184,166,.08)}
.bell-item__dot{width:8px;height:8px;border-radius:99px;background:var(--teal);flex:none;margin-top:6px;visibility:hidden}
.bell-item--unread .bell-item__dot{visibility:visible}
.bell-item__text{font-size:12.5px;line-height:1.45;color:var(--text)}
.bell-item__time{font-size:10.5px;color:var(--muted);margin-top:3px}
.bell-empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:12.5px}
.link-btn{background:none;border:none;color:var(--teal-dark);font-size:12px;font-weight:700;cursor:pointer;padding:0}
[data-theme="dark"] .link-btn{color:var(--teal)}
.link-btn:hover{text-decoration:underline}
@media (max-width:480px){
  .bell-panel{right:8px;left:8px;width:auto}
}

.body-row{display:flex;flex:1;min-height:0}
.sidebar{
  width:222px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  padding:14px 10px;overflow-y:auto;
}
.sidebar__group-title{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted-2);padding:12px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
  color:var(--text);text-decoration:none;font-size:13.5px;font-weight:600;cursor:pointer;
  border:none;background:none;width:100%;text-align:left;white-space:nowrap;
}
.nav-item svg{width:17px;height:17px;flex:none;color:var(--muted)}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--teal);color:#fff}
.nav-item.active svg{color:#fff}

main{flex:1;min-width:0;padding:18px;overflow-x:hidden}
.view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.view-head h1{font-size:21px}
.view-head p{color:var(--muted);font-size:13px;margin:0}

/* ============================================================
   4 — PRIMITIVES: buttons, inputs, cards, badges
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:var(--radius-sm);border:1px solid transparent;
  font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap;
  background:var(--surface-2);color:var(--text);border-color:var(--border);
  text-decoration:none;
}
.btn svg{width:15px;height:15px}
.btn:hover{filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn--primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn--primary:hover{background:var(--teal-dark);border-color:var(--teal-dark)}
.btn--navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn--danger{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.btn--ghost{background:transparent;border-color:transparent}
.btn--sm{padding:6px 11px;font-size:12.5px}
.btn--block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field .req{color:var(--red)}
.field input[type=text],.field input[type=email],.field input[type=password],
.field input[type=date],.field input[type=number],.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);font-size:13.5px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);outline:none}
.field small.hint{display:block;color:var(--muted-2);font-size:11px;margin-top:4px}
.field small.err{display:block;color:var(--red);font-size:11.5px;margin-top:4px;font-weight:700}
.field.has-err input,.field.has-err select{border-color:var(--red)}
.check-row{display:flex;align-items:flex-start;gap:9px;padding:10px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--surface-2);margin-bottom:9px}
.check-row input[type=checkbox]{margin-top:3px;width:16px;height:16px;flex:none;accent-color:var(--teal)}
.check-row label{font-size:13px;line-height:1.45;cursor:pointer}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media(max-width:700px){.grid-2,.grid-3{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:14px}
.card--pad-lg{padding:20px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi__label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi__value{font-size:26px;font-weight:800;margin-top:4px}
.kpi__sub{font-size:11.5px;color:var(--muted-2);margin-top:2px}
.kpi--accent{border-color:var(--teal);background:linear-gradient(180deg,rgba(20,184,166,.08),transparent)}
.kpi--warn{border-color:var(--yellow-line);background:var(--yellow-bg)}

.section-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:1000px){.section-grid{grid-template-columns:1fr}}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:1000px){.two-col{grid-template-columns:1fr}}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:11px;font-weight:800;border:1px solid transparent;white-space:nowrap;line-height:1.6}
.badge--green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.badge--yellow{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-line)}
.badge--red{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.badge--blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-line)}
.badge--gray{background:var(--gray-bg);color:var(--gray);border-color:var(--gray-line)}

.progress{height:8px;border-radius:99px;background:var(--gray-bg);overflow:hidden}
.progress__bar{height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.progress__bar--red{background:var(--red)}
.progress__bar--yellow{background:var(--yellow)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;
  border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:700;cursor:pointer}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
.chip__count{background:rgba(0,0,0,.08);border-radius:99px;padding:1px 7px;font-size:11px}
.chip.active .chip__count{background:rgba(255,255,255,.2)}
[data-theme="dark"] .chip__count{background:rgba(255,255,255,.1)}

.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--radius-sm);
  border:1px solid var(--yellow-line);background:var(--yellow-bg);color:var(--text);margin-bottom:8px;font-size:13px}
.alert svg{width:17px;height:17px;flex:none;color:var(--yellow);margin-top:1px}
.alert--red{border-color:var(--red-line);background:var(--red-bg)}
.alert--red svg{color:var(--red)}
.alert--blue{border-color:var(--blue-line);background:var(--blue-bg)}
.alert--blue svg{color:var(--blue)}
.alert b{font-weight:800}

.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty svg{width:34px;height:34px;color:var(--muted-2);margin-bottom:8px}

/* ============================================================
   5 — TABLES
   ============================================================ */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
thead th{text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
  color:var(--muted);padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);
  white-space:nowrap;position:sticky;top:0}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.cell-muted{color:var(--muted)}
.cell-strong{font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.row-flag-red{background:var(--red-bg)}
.row-flag-red:hover{filter:brightness(.98)}
.tools-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tools-row input[type=text],.tools-row select{padding:8px 11px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--surface);font-size:13px;color:var(--text)}
.tools-row .search{flex:1;min-width:160px}

/* ============================================================
   6 — CARD LISTS (vacancies)
   ============================================================ */
.vac-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.vac-card__top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.region-tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.04em;background:var(--navy);color:#fff;margin-bottom:8px}
.vac-card__title{font-size:16.5px;font-weight:800}
.vac-card__meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.vac-card__body{margin-top:10px;font-size:13px;color:var(--text)}
.vac-card__stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0;text-align:center}
@media(max-width:700px){.vac-card__stats{grid-template-columns:repeat(3,1fr)}}
.vac-stat{background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 4px}
.vac-stat__n{font-size:15px;font-weight:800}
.vac-stat__l{font-size:9.5px;color:var(--muted);text-transform:uppercase;font-weight:700}
.vac-card__footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.deadline-tag{font-size:12px;font-weight:700;color:var(--muted)}
.deadline-tag.soon{color:var(--red)}

/* ============================================================
   7 — MODALS
   ============================================================ */
.modal-overlay{position:fixed;inset:0;background:rgba(8,14,28,.55);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:640px;
  max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);margin:auto}
.modal--wide{max-width:840px}
.modal__head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;
  border-bottom:1px solid var(--border);flex:none}
.modal__head h2{font-size:16.5px}
.modal__close{width:32px;height:32px;border-radius:99px;border:none;background:var(--surface-2);
  color:var(--text);cursor:pointer;display:grid;place-items:center;flex:none}
.modal__body{padding:18px;overflow-y:auto}
.modal__foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;
  gap:8px;flex:none;flex-wrap:wrap}

/* ============================================================
   8 — GATES (rules) & LOGIN
   ============================================================ */
.login-wrap{min-height:100vh;display:flex;position:relative}
.login-theme-toggle{position:fixed;top:14px;right:14px;z-index:10;
  background:var(--surface);border-color:var(--border);color:var(--text)}
.login-theme-toggle:hover{background:var(--surface-2)}
.login-hero{flex:1.1;background:linear-gradient(160deg,var(--navy),#132f5e);color:#fff;
  padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.login-hero__badge{width:52px;height:52px;border-radius:14px;background:var(--teal);display:grid;
  place-items:center;font-weight:800;font-size:24px;margin-bottom:10px}
.login-hero h1{font-size:30px;max-width:14ch}
.login-hero p{color:rgba(255,255,255,.75);max-width:36ch;font-size:14.5px}
.login-hero__points{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.login-hero__point{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:rgba(255,255,255,.85)}
.login-hero__point svg{width:17px;height:17px;color:var(--teal);flex:none;margin-top:1px}
.login-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.login-box{width:100%;max-width:360px}
.login-box h2{font-size:20px;margin-bottom:4px}
.login-box .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.login-support{margin-top:18px;padding:11px 12px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);font-size:12px;color:var(--muted)}
.demo-creds{margin-top:14px;font-size:11.5px;color:var(--muted-2);background:var(--surface-2);
  border:1px dashed var(--border);border-radius:var(--radius-sm);padding:9px 11px}
@media(max-width:800px){.login-hero{display:none}}

.gate-wrap{max-width:640px;margin:0 auto;padding:8px 0 40px}
.gate-rule{display:flex;gap:12px;padding:13px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);margin-bottom:10px}
.gate-rule__n{width:26px;height:26px;border-radius:99px;background:var(--navy);color:#fff;flex:none;
  display:grid;place-items:center;font-weight:800;font-size:12px}
.gate-rule b{display:block;margin-bottom:2px;font-size:13.5px}
.gate-rule span{font-size:12.5px;color:var(--muted)}

/* ============================================================
   9 — TOASTS
   ============================================================ */
.toast-host{position:fixed;top:74px;right:14px;z-index:999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.toast{background:var(--navy);color:#fff;padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;
  box-shadow:var(--shadow-lg);display:flex;gap:9px;align-items:center;animation:toastIn .2s ease}
.toast--ok{background:var(--green);color:#06280f}
.toast--err{background:var(--red);color:#3a0a0a}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ============================================================
   10 — MISC: donut, bars, timeline, leaderboard
   ============================================================ */
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:140px;height:140px;border-radius:50%;flex:none}
.donut-legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.donut-legend__row{display:flex;align-items:center;gap:8px}
.donut-legend__dot{width:10px;height:10px;border-radius:3px;flex:none}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.bar-row__label{width:92px;flex:none;color:var(--muted);font-weight:700}
.bar-row__track{flex:1;height:10px;background:var(--gray-bg);border-radius:99px;overflow:hidden}
.bar-row__fill{height:100%;background:var(--teal);border-radius:99px}
.bar-row__n{width:26px;text-align:right;font-weight:800;flex:none}

.timeline{display:flex;flex-direction:column;gap:0;margin-top:6px}
.timeline__item{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}
.timeline__item:last-child{border-bottom:none}
.timeline__dot{width:9px;height:9px;border-radius:99px;background:var(--teal);margin-top:5px;flex:none}
.timeline__body b{font-size:12.5px}
.timeline__body .when{font-size:11px;color:var(--muted-2)}
.timeline__body .note{font-size:12.5px;color:var(--muted);margin-top:2px}

.leaderboard-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border)}
.leaderboard-row:last-child{border-bottom:none}
.lb-medal{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-weight:800;
  font-size:12px;background:var(--gray-bg);color:var(--gray);flex:none}
.lb-medal--1{background:#fde68a;color:#78350f}
.lb-medal--2{background:#e2e8f0;color:#334155}
.lb-medal--3{background:#fbcfe8;color:#831843}
.lb-name{font-weight:700;font-size:13px;flex:1;min-width:0}
.lb-country{font-size:11px;color:var(--muted-2)}
.lb-stats{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex:none}
.lb-stats b{color:var(--text)}

.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;font-size:13px;margin-bottom:14px}
@media(max-width:560px){.data-grid{grid-template-columns:1fr}}
.data-grid .dg-item span{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.data-grid .dg-item b{font-size:13.5px}

.checklist-item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border)}
.checklist-item:last-child{border-bottom:none}
.checklist-item input{width:16px;height:16px;accent-color:var(--teal)}

.subtabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.subtab{padding:9px 4px;margin-right:14px;border:none;background:none;font-weight:700;font-size:13px;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.subtab.active{color:var(--teal-dark);border-color:var(--teal)}
[data-theme="dark"] .subtab.active{color:var(--teal)}

/* ============================================================
   11 — MOBILE (390px pass)
   ============================================================ */
@media(max-width:820px){
  .sidebar{position:static;width:auto;display:flex;overflow-x:auto;padding:8px;gap:4px;border-right:none;
    border-bottom:1px solid var(--border);white-space:nowrap}
  .sidebar__group-title{display:none}
  .nav-item{flex:none}
  .body-row{flex-direction:column}
  main{padding:12px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .topbar__name{display:none}
  .topbar__user-meta{display:none}
}
@media(max-width:480px){
  .vac-card__stats{grid-template-columns:repeat(2,1fr)}
  .modal{max-width:100%;max-height:100vh;border-radius:0}
  .view-head{flex-direction:column}
}

  if(s===null||s===undefined) return '';

    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function maskPassport(p){
  if(!p) return '—';

function uid(prefix){ return prefix + '_' + (_uidSeq++) + '_' + Math.random().toString(36).slice(2,7); }

  var d = iso ? new Date(iso) : new Date();
  d.setDate(d.getDate()+n);

function daysBetween(fromISO, toISO){
  var a = new Date(fromISO); a.setHours(0,0,0,0);
  var b = toISO ? new Date(toISO) : new Date(); b.setHours(0,0,0,0);
  return Math.round((b-a)/86400000);
}
function subtractWorkingDays(iso, n){
  var d = new Date(iso);
  var left = n;
  while(left>0){
    d.setDate(d.getDate()-1);
    var day = d.getDay();
    if(day!==0 && day!==6) left--;
  }
  return d.toISOString();
}
function fmtDate(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}
function fmtDateTime(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  var h = d.getHours(), m = d.getMinutes();
  return fmtDate(iso) + ', ' + (h<10?'0'+h:h) + ':' + (m<10?'0'+m:m);
}
function fmtMoney(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('en-US', {maximumFractionDigits:0});
}
function pct(a,b){ if(!b) return 0; return Math.round((a/b)*100); }
function toast(msg, type){
  var host = qs('#toastHost');
  var el = document.createElement('div');
  el.className = 'toast' + (type==='ok'?' toast--ok':type==='err'?' toast--err':'');
  el.innerHTML = '<span>'+esc(msg)+'</span>';
  host.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

  if(!name) return '?';
  var parts = name.trim().split(/\s+/);

    var vac = vacancies.filter(function(v){return v.id===p.vacancyId;})[0];
    var c = addCandidate({
      agentId:p.agentId, vacancyId:p.vacancyId, firstName:fn, lastName:ln, nationality:nat,
      specialty: vac ? vac.title : 'General', status:p.status, compliance:p.compliance,
      consentAt:createdAt, confirmed: !!p.confirmed
    });
    pushHistory(c.id, null, 'New', 'system', 'Candidate submitted by agent.', createdAt);
    if(p.status!=='New'){
      pushHistory(c.id, 'New', p.status, 'admin@workunity.com', p.reason || 'Status updated.', dOff(-p.daysAgo+1));
      c.status = p.status;
    }
    if(p.status==='Arrived'){
      c.arrivedAt = dOff(-p.arrivedDaysAgo);
      c.permitIssued = dOff(-p.permitDaysAgo);
      c.permitExpiry = addDays(c.permitIssued, 60);
      c.retention = p.retention || 0;
      c.checklist = { expectations:true, skill:true, briefing:true, docs:true };
      if(p.retention>=30){ c.calls.w7=true; c.calls.w30=true; c.calls.c30=true; }
      if(p.retention>=90){ c.calls.w90=true; c.calls.c90=true; }
    }
    if(p.reason && (p.status==='Rejected' || p.status==='Duplicate' || p.status==='Incident')){
      c.notes = p.reason;
    }
    if(p.status==='Incident'){
      incidents.push({ id:uid('inc'), subjectName:c.firstName+' '+c.lastName, subjectId:c.id,
        type:'Housing / welfare', note:p.reason, status:'open', createdAt:dOff(-p.daysAgo+1), closedAt:null });
    }
  });

  /* one closed incident for variety */
  incidents.push({ id:uid('inc'), subjectName:'Priya Sharma (agent)', subjectId:'a2', type:'Process query',
    note:'Agent asked about delayed screening feedback — resolved by coordinator call.',
    status:'closed', createdAt:dOff(-25), closedAt:dOff(-24) });

  /* one candidate at full quota edge + one true waitlist example against v2 (quota 10) */
  for(var i=0;i<7;i++){
    var fn2 = firstNamesIN[i%firstNamesIN.length], ln2 = lastNamesIN[i%lastNamesIN.length];
    var c2 = addCandidate({ agentId:'a2', vacancyId:'v2', firstName:fn2, lastName:ln2, nationality:'India',
      specialty:'Welder', status:'Screening', compliance:'Yellow', consentAt:dOff(-2) });
    pushHistory(c2.id, null, 'New', 'system', 'Candidate submitted by agent.', dOff(-2));
  }
  var wl = addCandidate({ agentId:'a3', vacancyId:'v2', firstName:'Jahid', lastName:'Hasan', nationality:'Bangladesh',
    specialty:'Welder', status:'New', compliance:'Yellow', consentAt:dOff(-1), waitlist:true });
  pushHistory(wl.id, null, 'New', 'system', 'Vacancy quota was full at submission time — placed on waitlist.', dOff(-1));

  var paidCommissions = {};
  candidates.forEach(function(c, idx){
    var planItem = plan[idx];
    if(planItem && planItem.paid){
      planItem.paid.forEach(function(mk){ paidCommissions[c.id+'_'+mk] = addDays(c.arrivedAt, 5); });
    }
  });

  return {
    version: DB_VERSION,
    agents: agents,
    vacancies: vacancies,
    candidates: candidates,
    statusHistory: statusHistory,
    incidents: incidents,
    paidCommissions: paidCommissions,
    notifications: [],
    session: null
  };
}

function loadDB(){
  var raw = null;
  try{ raw = localStorage.getItem(DB_KEY); }catch(e){}
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
function saveDB(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){ console && console.warn && void 0; }
}
function migrateDB(){
  var existing = loadDB();
  if(!existing){
    db = seedDB();
    saveDB();
    return;
  }
  /* idempotent backfill: make sure every expected top-level key exists */
  var fresh = seedDB();
  Object.keys(fresh).forEach(function(k){
    if(existing[k]===undefined) existing[k] = fresh[k];
  });
  if(existing.version === undefined) existing.version = DB_VERSION;
  db = existing;
  saveDB();
}
function resetDemoData(){
  try{ localStorage.removeItem(DB_KEY); }catch(e){}
  db = seedDB();
  saveDB();
  state.session = null;
  state.view = 'dashboard';
  toast('Demo data has been reset.', 'ok');
  render();
}

function doLogin(email, password){
  email = (email||'').trim().toLowerCase();
  var match = CREDS.filter(function(c){ return c.email===email && c.password===password; })[0];
  if(!match){ toast('Incorrect email or password.', 'err'); return false; }
  if(match.role==='agent'){
    var agentRecord = getAgent(match.agentId);
    if(agentRecord && agentRecord.status!=='Active'){
      toast('This agent account is suspended. Contact your coordinator.', 'err');
      return false;
    }
  }
  state.session = { role: match.role, agentId: match.agentId };
  try{ localStorage.setItem(DB_KEY+'_session', JSON.stringify(state.session)); }catch(e){}
  state.view = 'dashboard';
  state.bellOpen = false;
  computeGateStep();
  toast('Welcome back!', 'ok');
  render();
  return true;
}
function doLogout(){
  state.session = null;
  try{ localStorage.removeItem(DB_KEY+'_session'); }catch(e){}
  render();
}
function restoreSession(){
  var raw = null;
  try{ raw = localStorage.getItem(DB_KEY+'_session'); }catch(e){}
  if(!raw) return;
  try{ state.session = JSON.parse(raw); }catch(e){}
}
function currentAgent(){
  if(!state.session || state.session.role!=='agent') return null;
  return db.agents.filter(function(a){return a.id===state.session.agentId;})[0] || null;
}
function computeGateStep(){
  if(!state.session || state.session.role!=='agent'){ state.gateStep = null; return; }
  var a = currentAgent();
  if(!a){ state.gateStep = null; return; }
  if(!a.rulesAcceptedAt){ state.gateStep = 'rules'; return; }
  state.gateStep = null;
}

function navigate(view, params){
  state.view = view;
  state.params = params || {};
  state.bellOpen = false;
  render();
  var main = qs('main');
  if(main) main.scrollTop = 0;
}

function render(){
  var app = qs('#app');
  if(!state.session){
    app.innerHTML = renderLogin();
    return;
  }
  computeGateStep();
  var role = state.session.role;
  var bodyHtml;
  if(role==='agent' && state.gateStep==='rules'){
    bodyHtml = renderRulesGate();
  } else {
    bodyHtml = renderCurrentView();
  }
  app.innerHTML =
    '<div class="shell">' +
      renderTopbar() +
      '<div class="body-row">' +
        (state.gateStep ? '' : renderSidebar()) +
        '<main id="mainContent">' + bodyHtml + '</main>' +
      '</div>' +
    '</div>';
}

function renderCurrentView(){
  var role = state.session.role;
  var v = state.view;

    if(role==='agent'){
      if(v==='dashboard') return renderAgentDashboard();

    return '<div class="empty"><b>Something went wrong rendering this page.</b><br><span class="mono">'+esc(err && err.message)+'</span></div>';
  }
}

function saveVacancy(id){
  var title = qs('#vacTitle').value.trim();
  var employer = qs('#vacEmployer').value.trim();
  var country = qs('#vacCountry').value.trim();
  var city = qs('#vacCity').value.trim();
  var region = qs('#vacRegion').value;
  var quota = parseInt(qs('#vacQuota').value,10);
  var fee = parseInt(qs('#vacFee').value,10);
  var salary = qs('#vacSalary').value.trim();
  var requirements = qs('#vacRequirements').value.trim();
  var conditions = qs('#vacConditions').value.trim();
  var deadlineVal = qs('#vacDeadline').value;
  var status = qs('#vacStatus').value;
  var verified = qs('#vacVerified').checked;

  if(!title || !city || !country || !quota || quota<1){
    toast('Please fill in title, country, city, and a valid quota.', 'err'); return;
  }
  var deadlineISO = deadlineVal ? new Date(deadlineVal).toISOString() : addDays(nowISO(), 30);
  var fields = { title:title, employer:employer, country:country, city:city, region:region,
    quota:quota, agentFee:fee||0, salary:salary, requirements:requirements, conditions:conditions,
    deadline:deadlineISO, status:status, verified:verified };

  if(id){
    var v = getVacancy(id);
    if(!v) return;
    Object.assign(v, fields);
    toast('Vacancy updated.', 'ok');
  } else {
    db.vacancies.push(Object.assign({ id:uid('v') }, fields));
    toast('Vacancy created.', 'ok');
  }
  saveDB();
  closeModal();
  render();
}

function deleteVacancy(id){
  var vs = vacancyStats(id);
  if(vs.submitted>0){ toast('Cannot delete a vacancy that already has candidates.', 'err'); return; }
  if(!confirm('Delete this vacancy? This cannot be undone.')) return;
  db.vacancies = db.vacancies.filter(function(v){ return v.id!==id; });
  saveDB();
  closeModal();
  toast('Vacancy deleted.', 'ok');
  render();
}

function saveCandidateStatusChange(candId){
  var c = getCandidate(candId);
  if(!c) return;
  var newStatus = qs('#editStatus').value;
  var newCompliance = qs('#editCompliance').value;
  var note = qs('#editNote').value.trim();
  if(!note){ toast('Please add a note describing this change.', 'err'); return; }
  var oldStatus = c.status, oldCompliance = c.compliance;
  var statusChanged = newStatus!==oldStatus;
  var complianceChanged = newCompliance!==oldCompliance;
  if(!statusChanged && !complianceChanged){
    toast('No changes to save.', 'err'); return;
  }
  if(newStatus==='Arrived' && oldStatus!=='Arrived'){
    var arrivedVal = qs('#editArrivedAt') ? qs('#editArrivedAt').value : '';
    var permitVal = qs('#editPermitIssued') ? qs('#editPermitIssued').value : '';
    var arrivedAt = arrivedVal ? new Date(arrivedVal).toISOString() : nowISO();
    var permitIssued = permitVal ? new Date(permitVal).toISOString() : nowISO();
    c.arrivedAt = arrivedAt;
    c.permitIssued = permitIssued;
    c.permitExpiry = addDays(permitIssued, 60);
  }
  c.status = newStatus;
  c.compliance = newCompliance;
  if((newStatus==='Rejected' || newStatus==='Duplicate') && note){
    c.notes = note;
  }
  var noteFinal = note;
  if(!statusChanged && complianceChanged){
    noteFinal = 'Compliance changed from '+oldCompliance+' to '+newCompliance+'. ' + note;
  }
  pushStatusHistory(candId, oldStatus, newStatus, 'admin@workunity.com', noteFinal);
  saveDB();
  if(statusChanged){
    pushNotification('agent:'+c.agentId, 'Your candidate '+c.firstName+' '+c.lastName+' is now '+newStatus+'.');
  }
  toast('Candidate updated.', 'ok');
  viewCandidateAdmin(candId);
}
function toggleConfirmed(candId){
  var c = getCandidate(candId);
  if(!c) return;
  c.confirmed = !c.confirmed;
  saveDB();
  toast(c.confirmed ? 'Candidate marked as confirmed.' : 'Confirmation removed.', 'ok');
  viewCandidateAdmin(candId);
}
function activateFromWaitlist(candId){
  var c = getCandidate(candId);
  if(!c || !c.waitlist) return;
  var stats = vacancyStats(c.vacancyId);
  if(stats.remainingClamped<=0){
    toast('No open slots yet — vacancy quota is still full.', 'err');
    return;
  }
  c.waitlist = false;
  pushStatusHistory(candId, c.status, c.status, 'admin@workunity.com', 'Activated from waitlist — a quota slot opened up.');
  saveDB();
  pushNotification('agent:'+c.agentId, 'Your waitlisted candidate '+c.firstName+' '+c.lastName+' has been activated.');
  toast('Candidate activated from waitlist.', 'ok');
  viewCandidateAdmin(candId);
}

/* ---------------------------------------------------------------
   7a. BUSINESS LOGIC / DERIVED DATA (pure functions over db)
   --------------------------------------------------------------- */
function getVacancy(id){ return db.vacancies.filter(function(v){return v.id===id;})[0] || null; }
function getAgent(id){ return db.agents.filter(function(a){return a.id===id;})[0] || null; }
function getCandidate(id){ return db.candidates.filter(function(c){return c.id===id;})[0] || null; }

/* Rule: quota counts exclude Rejected, Duplicate, and waitlisted candidates */
function countsTowardQuota(c){
  return c.status!=='Rejected' && c.status!=='Duplicate' && !c.waitlist;
}
function vacancyStats(vacancyId){
  var cands = db.candidates.filter(function(c){ return c.vacancyId===vacancyId; });
  var active = cands.filter(countsTowardQuota);
  var approved = active.filter(function(c){ return ['Approved','Processing','Arrived'].indexOf(c.status)!==-1; });
  var arrived = active.filter(function(c){ return c.status==='Arrived'; });
  var vac = getVacancy(vacancyId);
  var quota = vac ? vac.quota : 0;
  var remaining = quota - active.length;
  return { quota:quota, submitted:cands.length, active:active.length, approved:approved.length,
    arrived:arrived.length, remaining: remaining, remainingClamped: Math.max(0, remaining) };
}
function agentVacancyStats(vacancyId, agentId){
  return db.candidates.filter(function(c){ return c.vacancyId===vacancyId && c.agentId===agentId; }).length;
}
function visibleVacanciesForAgents(){
  /* R1: agents only ever see open + verified vacancies */
  return db.vacancies.filter(function(v){ return v.status==='open' && v.verified===true; });
}
function isDuplicatePassport(passport, excludeId){
  var norm = String(passport||'').trim().toUpperCase();
  if(!norm) return false;
  return db.candidates.some(function(c){
    return c.id!==excludeId && String(c.passport||'').trim().toUpperCase()===norm;
  });
}
function candidatesByAgent(agentId){
  return db.candidates.filter(function(c){ return c.agentId===agentId; });
}
function agentStats(agentId){
  var cands = candidatesByAgent(agentId);
  var submittedNonDup = cands.filter(function(c){ return c.status!=='Duplicate'; });
  var arrived = cands.filter(function(c){ return c.status==='Arrived'; });
  var approvedInProcess = cands.filter(function(c){ return c.status==='Approved' || c.status==='Processing'; });
  var rejected = cands.filter(function(c){ return c.status==='Rejected'; });
  var retained30 = cands.filter(function(c){ return c.retention>=30; });
  var conv = pct(arrived.length, submittedNonDup.length || 1);
  var rejRate = pct(rejected.length, submittedNonDup.length || 1);
  return {
    total: cands.length, arrived: arrived.length, approvedInProcess: approvedInProcess.length,
    rejected: rejected.length, retained30: retained30.length,
    conversion: submittedNonDup.length ? conv : 0, rejectionRate: submittedNonDup.length ? rejRate : 0
  };
}
function computeLevelProgress(agent){
  var st = agentStats(agent.id);
  if(agent.level==='Candidate Agent' || agent.level==='Agent'){
    var target = agent.level==='Candidate Agent' ? 5 : 30;
    var nextLevel = agent.level==='Candidate Agent' ? 'Agent' : 'Corridor Partner';
    var extra = nextLevel==='Corridor Partner' ? ' + 1 year tenure + 0 violations' : '';
    return { have: st.arrived, need: target, nextLevel: nextLevel, extraText: extra,
      pct: Math.min(100, pct(st.arrived, target)) };
  }
  return { have: st.arrived, need: st.arrived, nextLevel: null, extraText: '', pct: 100 };
}
function leaderboardRows(){
  return db.agents.map(function(a){
    var st = agentStats(a.id);
    return { agent:a, arrived:st.arrived, approved:st.approvedInProcess, active:st.total, conversion:st.conversion };
  }).sort(function(x,y){
    if(y.arrived !== x.arrived) return y.arrived - x.arrived;
    return y.conversion - x.conversion;
  });
}

function commissionMilestones(){
  var rows = [];
  db.candidates.forEach(function(c){
    if(c.status!=='Arrived') return;
    var vac = getVacancy(c.vacancyId);
    if(!vac) return;
    var fee = vac.agentFee || 0;
    var stages = [
      { key:'arrived', label:'Arrived', earned:true, rate:COMMISSION_RATE.arrived },
      { key:'r30', label:'Retained 30 days', earned:c.retention>=30, rate:COMMISSION_RATE.r30 },
      { key:'r90', label:'Retained 90 days', earned:c.retention>=90, rate:COMMISSION_RATE.r90 }
    ];
    stages.forEach(function(s){
      if(!s.earned) return;
      var pk = c.id+'_'+s.key;
      rows.push({
        candidateId:c.id, candidateName:c.firstName+' '+c.lastName, agentId:c.agentId,
        vacancyId:c.vacancyId, vacancyTitle:vac.title, vacancyCity:vac.city,
        milestone:s.key, milestoneLabel:s.label, amount:Math.round(fee*s.rate),
        paid: !!db.paidCommissions[pk], paidDate: db.paidCommissions[pk] || null,
        arrivedAt:c.arrivedAt
      });
    });
  });
  return rows.sort(function(a,b){ return new Date(b.arrivedAt)-new Date(a.arrivedAt); });
}
function commissionRowsForAgent(agentId){
  return commissionMilestones().filter(function(r){ return r.agentId===agentId; });
}
function commissionSummary(rows){
  var total=0, paid=0, pending=0;
  rows.forEach(function(r){
    total += r.amount;
    if(r.paid) paid += r.amount; else pending += r.amount;
  });
  return { total:total, paid:paid, pending:pending, count:rows.length };
}
function csvEscape(v){
  var s = String(v===null||v===undefined?'':v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function downloadCSV(filename, rows){
  var csv = rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function badgeForStatus(s){
  var map = { New:'blue', Screening:'blue', Approved:'green', Processing:'green', Arrived:'green',
    Rejected:'red', Duplicate:'red', Incident:'red' };
  return '<span class="badge badge--'+(map[s]||'gray')+'">'+esc(s)+'</span>';
}
function badgeForCompliance(c){

  return '<span class="badge badge--'+(map[c]||'gray')+'">'+esc(c)+'</span>';
}
function badgeForConfirmed(v){
  return v ? '<span class="badge badge--green">'+icon('check')+' Candidate confirmed</span>'
           : '<span class="badge badge--yellow">Awaiting confirmation</span>';
}
function waHref(number, text){
  var digits = String(number||'').replace(/[^\d]/g,'');
  return 'https://wa.me/' + digits + (text ? ('?text='+encodeURIComponent(text)) : '');
}
function daysLeftLabel(deadlineISO){
  var d = daysBetween(nowISO(), deadlineISO);
  if(d<0) return '<span class="deadline-tag soon">Deadline passed</span>';
  if(d<=7) return '<span class="deadline-tag soon">'+d+' days left</span>';
  return '<span class="deadline-tag">'+d+' days left</span>';
}

      '<td style="min-width:100px"><div class="progress"><div class="progress__bar" style="width:'+pct(vs.active,vs.quota)+'%"></div></div></td></tr>';
  });

    kpi('Conversion', st.conversion+'%','arrived ÷ submitted') +

    kpi('Retained 30+ days', st.retained30,'') +
    '</div>';

  if(reasons.length){
    html += '<div style="margin-top:12px"><b style="font-size:12.5px">Rejection reasons</b>';

    html += '<div class="vac-card__footer"><span>'+daysLeftLabel(v.deadline)+' · My candidates here: <b>'+mine+'</b></span>' +

function onSubmitVacancyChange(id){
  state.params.vacancyId = id;
  render();
}
function syncWhatsapp(){
  var same = qs('#scSameWA');
  if(same && same.checked){
    var phone = qs('#scPhone'), wa = qs('#scWhatsapp');
    if(phone && wa){ wa.value = phone.value; wa.disabled = true; }
  } else {
    var wa2 = qs('#scWhatsapp'); if(wa2) wa2.disabled = false;
  }
}
function handleSubmitCandidate(ev){
  ev.preventDefault();
  var a = currentAgent();
  var vacancyId = qs('#scVacancy').value;
  var vac = getVacancy(vacancyId);
  if(!vac || vac.status!=='open' || !vac.verified){ toast('This vacancy is no longer open for submissions.', 'err'); return false; }

  var passport = qs('#scPassport').value.trim();
  if(!passport){ toast('Passport number is required.', 'err'); return false; }
  if(isDuplicatePassport(passport, null)){
    toast('This passport number already exists in the system. Duplicate submissions are blocked.', 'err');
    qs('#scPassport').classList.add('has-err');
    return false;
  }
  if(!qs('#scExpectations').checked || !qs('#scConsent').checked){
    toast('Please confirm both required checkboxes before submitting.', 'err');
    return false;
  }

  var vs = vacancyStats(vac.id);
  var waitlist = vs.remainingClamped<=0;

  var c = {
    id: uid('c'), agentId: a.id, vacancyId: vacancyId,
    firstName: qs('#scFirst').value.trim(), lastName: qs('#scLast').value.trim(),
    dob: qs('#scDob').value, nationality: qs('#scNat').value.trim(),
    passport: passport, phone: qs('#scPhone').value.trim(), whatsapp: qs('#scWhatsapp').value.trim(),
    specialty: vac.title, experience: qs('#scExperience').value.trim(),
    consentAt: nowISO(), status:'New', compliance:'Yellow', confirmed:false, waitlist: waitlist,
    retention:0, arrivedAt:null, permitIssued:null, permitExpiry:null, registrationDone:false,
    calls:{ w7:false, w30:false, w90:false, c30:false, c90:false },
    checklist:{ expectations:true, skill:false, briefing:false, docs:false },
    notes:''
  };
  db.candidates.push(c);
  pushStatusHistory(c.id, null, 'New', a.email, waitlist ? 'Submitted by agent — quota full, placed on waitlist.' : 'Submitted by agent.');
  pushNotification('admin', a.name+' submitted a new candidate for '+vac.title+' ('+vac.city+').');
  saveDB();
  toast(waitlist ? 'Candidate saved to the waitlist — quota is currently full.' : 'Candidate submitted successfully.', 'ok');
  navigate('mycandidates');
  return false;
}

    var vac = getVacancy(c.vacancyId);
    html += '<tr'+(c.status==='Rejected'?' class="row-flag-red"':'')+'>' +
      '<td class="cell-strong">'+esc(c.firstName+' '+c.lastName)+(c.waitlist?' <span class="badge badge--gray">Waitlist</span>':'')+'</td>' +
      '<td>'+esc(vac?vac.title+' · '+vac.city:'—')+'</td>' +
      '<td>'+badgeForStatus(c.status)+'</td><td>'+badgeForCompliance(c.compliance)+'</td>' +
      '<td>'+badgeForConfirmed(c.confirmed)+'</td><td class="mono">'+esc(maskPassport(c.passport))+'</td>' +
      '<td class="cell-muted">'+esc(fmtDate(c.consentAt))+'</td>' +
      '<td><button class="btn btn--sm" onclick="viewCandidate(\''+c.id+'\')">'+icon('eye')+' View</button></td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}
function setMcFilter(key,val){ state.params[key]=val; render(); }
function exportMyCandidatesCSV(){
  var a = currentAgent(); if(!a) return;
  var rows = [['Name','Vacancy','Status','Compliance','Confirmed','Passport (masked)','Submitted']];
  candidatesByAgent(a.id).forEach(function(c){
    var vac = getVacancy(c.vacancyId);
    rows.push([c.firstName+' '+c.lastName, vac?vac.title+' - '+vac.city:'', c.status, c.compliance,
      c.confirmed?'Yes':'No', maskPassport(c.passport), fmtDate(c.consentAt)]);
  });
  downloadCSV('my-candidates.csv', rows);
  toast('CSV exported.', 'ok');
}

function viewCandidate(id){
  var c = getCandidate(id);
  if(!c) return;
  openModal(renderCandidateReadOnly(c), {wide:true});
}
function renderCandidateReadOnly(c){
  var vac = getVacancy(c.vacancyId);
  var hist = candidateHistory(c.id);
  var html = modalHead(c.firstName+' '+c.lastName);
  html += '<div class="modal__body">';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+badgeForStatus(c.status)+badgeForCompliance(c.compliance)+badgeForConfirmed(c.confirmed)+(c.waitlist?'<span class="badge badge--gray">Waitlist</span>':'')+'</div>';

  html += '<div class="data-grid">' +
    dgItem('Vacancy', vac?vac.title+' · '+vac.city+', '+vac.country:'—') +
    dgItem('Nationality', c.nationality) +
    dgItem('Date of Birth', fmtDate(c.dob)) +
    dgItem('Passport', maskPassport(c.passport)) +
    dgItem('Specialty', c.specialty) +
    dgItem('Experience', c.experience) +
    dgItem('Phone', c.phone) +
    dgItem('Consent given', fmtDate(c.consentAt)) +
    '</div>';

  html += '<a class="btn" href="'+waHref(c.whatsapp)+'" target="_blank" rel="noopener">'+icon('whatsapp')+' Message on WhatsApp</a>';

  if(c.status==='Rejected' && c.notes){
    html += '<div class="alert alert--red" style="margin-top:14px">'+icon('incident')+'<span><b>Rejection reason:</b> '+esc(c.notes)+'</span></div>';
  }

  html += '<h3 style="margin-top:18px">Status Timeline</h3><div class="timeline">';
  hist.forEach(function(h){
    html += '<div class="timeline__item"><span class="timeline__dot"></span><div class="timeline__body">' +
      (h.oldStatus?esc(h.oldStatus)+' → ':'') + badgeForStatus(h.newStatus) +
      '<div class="when">'+esc(fmtDateTime(h.createdAt))+' · '+esc(h.changedBy)+'</div>' +
      (h.note?'<div class="note">'+esc(h.note)+'</div>':'') + '</div></div>';
  });
  html += '</div>';

  html += '<h3 style="margin-top:18px">Quality Checklist</h3>';
  html += checklistRow(c.id,'expectations','Expectations confirmed with candidate');
  html += checklistRow(c.id,'skill','Skill checked via WhatsApp video');
  html += checklistRow(c.id,'briefing','Pre-departure briefing done');
  html += checklistRow(c.id,'docs','Documents ready');

  html += '</div><div class="modal__foot"><button class="btn" onclick="closeModal()">Close</button></div>';
  return html;
}
function dgItem(label, value){
  return '<div class="dg-item"><span>'+esc(label)+'</span><b>'+esc(value||'—')+'</b></div>';
}
function checklistRow(candId, key, label){
  var c = getCandidate(candId);
  var checked = c && c.checklist && c.checklist[key];
  return '<div class="checklist-item"><input type="checkbox" id="chk_'+key+'_'+candId+'" '+(checked?'checked':'')+
    ' onchange="toggleChecklist(\''+candId+'\',\''+key+'\')"><label for="chk_'+key+'_'+candId+'">'+esc(label)+'</label></div>';
}
function toggleChecklist(candId, key){
  var c = getCandidate(candId);
  if(!c) return;
  c.checklist[key] = !c.checklist[key];
  saveDB();
  toast('Checklist updated.', 'ok');
}

/* ---------------------------------------------------------------
   8. INIT
   --------------------------------------------------------------- */
function init(){
  initTheme();
  migrateDB();
  restoreSession();
  if(state.session){ computeGateStep(); }
  render();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
